<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">GitHub stats placeholder</title>
  <desc id="desc">GitHub Actions will generate the statistics card after the next push or manual workflow run.</desc>
  <rect width="495" height="195" fill="#ffffff"/>
  <rect x="1" y="1" width="493" height="193" fill="none" stroke="#e5e7eb"/>
  <text x="24" y="42" fill="#111111" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">GitHub Statistics</text>
  <text x="24" y="78" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="14">Cards are generated locally in GitHub Actions.</text>
  <text x="24" y="102" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="14">They will update automatically after the next push.</text>
  <text x="24" y="142" fill="#6b7280" font-family="Segoe UI, Arial, sans-serif" font-size="12">Workflow: .github/workflows/update-readme-stats.yml</text>
</svg>
